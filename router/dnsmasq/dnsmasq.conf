#https://dnsmasq.org/docs/dnsmasq-man.html
# Included files
dhcp-hostsfile=/home/dhcphosts.conf
conf-file=/home/dnsmasq.cnames.conf
addn-hosts=/home/hosts
# activate to enable ipv6 router advertisment
enable-ra
# DHCPv6 and RA configuration per interface
# Eigene Link-Local-Adresse der jeweiligen Schnittstelle als IPv6-DNS nennen.
dhcp-option=option6:dns-server,[fe80::]
dhcp-option=option6:domain-search,jaylab.local
# DNS-LXC leitet nicht weiter: Präfixe/DNS ankündigen, keine Default-Route.
ra-param=enp1s0,10,0
ra-param=enp2s0,10,0
ra-param=enp3s0,10,0
ra-param=enp4s0,10,0
ra-param=enp5s0,10,0
ra-param=enp6s0,10,0
# Each interface defines its own DHCPv6/RA range further below via interface-scoped dhcp-range entries.

# Interface setup
interface=enp1s0
interface=enp2s0
interface=enp3s0
interface=enp4s0
interface=enp5s0
interface=enp6s0

listen-address=127.0.0.1
listen-address=::1
# IPv4 listen addresses per interface
listen-address=192.168.10.6
listen-address=192.168.20.6
listen-address=192.168.30.6
listen-address=192.168.40.6
listen-address=192.168.50.6
listen-address=192.168.60.6
# ULA IPv6 listen addresses per interface
listen-address=fd38:21a1:1b97:10::6
listen-address=fd38:21a1:1b97:20::6
listen-address=fd38:21a1:1b97:30::6
listen-address=fd38:21a1:1b97:40::6
listen-address=fd38:21a1:1b97:50::6
listen-address=fd38:21a1:1b97:60::6

bind-dynamic
#bind-interfaces

# don`t do it
#no-dhcp-interface=enp03s0
#no-dhcp-interface=enp04s0
#no-dhcp-interface=enp05s0
#no-dhcp-interface=enp06s0

bogus-priv
dnssec
filterwin2k
no-resolv
expand-hosts
localise-queries

# upstream servers
server=8.8.8.8
server=8.8.4.4
#dns-over-tls=8.8.8.8,8.8.4.4

# local servers
#server=192.168.10.3@enp1s0
#server=192.168.20.3@enp2s0
#server=192.168.40.3@enp4s0
#server=192.168.60.3@enp6s0

# Local reverse-DNS zones — answered from hosts/DHCP, never forwarded.
# Forward zone jaylab.local is already handled by 'local=/jaylab.local/' above.
# NOTE: The previous server=/jaylab.local/<own-ip> entries were REMOVED because
#       they overrode local=/jaylab.local/ and pointed to dnsmasq itself, causing
#       queries to be forwarded to upstream (8.8.8.8) which cannot resolve jaylab.local.
# IPv4 reverse zones (belt-and-suspenders with bogus-priv)
local=/10.168.192.in-addr.arpa/
local=/20.168.192.in-addr.arpa/
local=/30.168.192.in-addr.arpa/
local=/40.168.192.in-addr.arpa/
local=/50.168.192.in-addr.arpa/
local=/60.168.192.in-addr.arpa/
# IPv6 ULA reverse zones
local=/0.1.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/
local=/0.2.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/
local=/0.3.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/
local=/0.4.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/
local=/0.5.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/
local=/0.6.0.7.9.b.1.1.a.1.2.3.8.d.f.ip6.arpa/

#  DOT DNS-over-TLS (via stubby)
# server=127.0.0.1#1053
# server=127.0.0.1#53

#server=jaylab.local/

#  Google DNS for Google Domains
server=/google.com/8.8.8.8
server=/googleapis.com/8.8.8.8
server=/google.de/8.8.8.8
server=/googleusercontent.com/8.8.8.8
server=/gstatic.com/8.8.8.8
server=/gmail.com/8.8.8.8
server=/googlemail.com/8.8.8.8
server=/youtube.com/8.8.8.8
server=/youtu.be/8.8.8.8

domain=jaylab.local
local=/jaylab.local/
#local=/fritz.box/

# DHCP CONFIG
dhcp-authoritative

################# Guest / unknown BOD #################
# option default for unknown / new devices preparation for guest subnet
#dhcp-range=192.168.20.245,192.168.20.250,255.255.255.0,6h # general
#dhcp-option=option:router,192.168.20.6
#dhcp-option=option:dns-server,192.168.20.6
#dhcp-option=option:ntp-server,192.168.20.6
#dhcp-option=option:domain-search,jaylab.local
################# Guest / unknown EOD #################

################# Tagged ranges with ULA IPv6 BOD #################
# Admin network - Interface enp1s0
dhcp-range=tag:admin,enp1s0,192.168.10.100,192.168.10.240,255.255.255.0,6h
dhcp-range=tag:admin,enp1s0,::100,::ffff,constructor:enp1s0,6h

# General network - Interface enp2s0  
dhcp-range=tag:general,enp2s0,192.168.20.100,192.168.20.240,255.255.255.0,6h
#dhcp-range=tag:general,enp2s0,fd38:21a1:1b97:20::1000,fd38:21a1:1b97:20::11ff,slaac,ra-advrouter,ra-names,64,6h
dhcp-range=tag:general,enp2s0,::100,::ffff,constructor:enp2s0,6h

# Familie network - Interface enp3s0
dhcp-range=tag:familie,enp3s0,192.168.30.100,192.168.30.240,255.255.255.0,6h
dhcp-range=tag:familie,enp3s0,::100,::ffff,constructor:enp3s0,6h

# IoT network - Interface enp4s0
# Range from 100 - 199 is reserved for static ips logically bound to proxmox container IDs
dhcp-range=tag:iot,enp4s0,192.168.40.200,192.168.40.254,255.255.255.0,6h
dhcp-range=tag:iot,enp4s0,::100,::ffff,constructor:enp4s0,6h

# Media network - Interface enp5s0
dhcp-range=tag:media,enp5s0,192.168.50.100,192.168.50.240,255.255.255.0,6h
dhcp-range=tag:media,enp5s0,::100,::ffff,constructor:enp5s0,6h

# Guest network - Interface enp6s0 (for untagged devices)
dhcp-range=tag:!admin,tag:!general,tag:!familie,tag:!iot,tag:!media,enp6s0,192.168.60.100,192.168.60.240,255.255.255.0,6h
dhcp-range=tag:!admin,tag:!general,tag:!familie,tag:!iot,tag:!media,enp6s0,::100,::ffff,constructor:enp6s0,6h
################# Tagged ranges EOD #################

# DHCP options per interface with ULA IPv6 support

# Admin subnet (enp1s0) - Full access
dhcp-option=enp1s0,tag:admin,option:router,192.168.10.3
dhcp-option=enp1s0,tag:admin,option:dns-server,192.168.10.6,1.1.1.1
dhcp-option=enp1s0,tag:admin,option:ntp-server,192.168.50.1
dhcp-option=enp1s0,tag:admin,option:domain-search,jaylab.local
dhcp-option=enp1s0,tag:admin,option6:dns-server,[fe80::]

# General subnet (enp2s0) - Standard access
dhcp-option=enp2s0,tag:general,option:router,192.168.20.3
dhcp-option=enp2s0,tag:general,option:dns-server,192.168.20.6,1.1.1.1
dhcp-option=enp2s0,tag:general,option:ntp-server,192.168.50.1
dhcp-option=enp2s0,tag:general,option:domain-search,jaylab.local
dhcp-option=enp2s0,tag:general,option6:dns-server,[fe80::]

# Familie subnet (enp3s0) - Restricted access
dhcp-option=enp3s0,tag:familie,option:router,192.168.30.3
dhcp-option=enp3s0,tag:familie,option:dns-server,192.168.30.6
dhcp-option=enp3s0,tag:familie,option:domain-search,jaylab.local
dhcp-option=enp3s0,tag:familie,option6:dns-server,[fe80::]

# IoT subnet (enp4s0) - Device network
dhcp-option=enp4s0,tag:iot,option:router,192.168.40.3
dhcp-option=enp4s0,tag:iot,option:dns-server,192.168.40.6,1.1.1.1
dhcp-option=enp4s0,tag:iot,option:ntp-server,192.168.50.1
dhcp-option=enp4s0,tag:iot,option:domain-search,jaylab.local
dhcp-option=enp4s0,tag:iot,option6:dns-server,[fe80::]

# Media subnet (enp5s0) - Media services
dhcp-option=enp5s0,tag:media,option:router,192.168.50.3
dhcp-option=enp5s0,tag:media,option:dns-server,192.168.50.6,1.1.1.1
dhcp-option=enp5s0,tag:media,option:ntp-server,192.168.50.1
dhcp-option=enp5s0,tag:media,option:domain-search,jaylab.local
dhcp-option=enp5s0,tag:media,option6:dns-server,[fe80::]

# Guest subnet (enp6s0) - Limited access with public DNS
dhcp-option=enp6s0,option:router,192.168.60.3
dhcp-option=enp6s0,option:dns-server,8.8.8.8,1.1.1.1
dhcp-option=enp6s0,option:domain-search,jaylab.local
dhcp-option=enp6s0,option6:dns-server,[fe80::]

#cache-size=2048
#log-dhcp
#log-queries
#no-daemon

